services:
  # No local Postgres container — the database is Neon (or any other
  # Postgres reachable over the network). Both backend-* services read
  # DATABASE_URL (and everything else) from backend/.env via `env_file`,
  # so that file is the single place connection details live.

  # One-shot: applies Alembic migrations, then exits. `backend` waits for it
  # to succeed rather than migrating on its own boot, so a crash-looping
  # backend container never leaves the schema half-migrated.
  backend-migrate:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    command: ["sh", "-c", "cd backend && python -m alembic upgrade head"]
    env_file:
      - ../backend/.env

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - workspaces:/app/backend/workspaces
      - uploads:/app/backend/uploads
    depends_on:
      backend-migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  workspaces:
  uploads:
